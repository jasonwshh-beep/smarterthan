<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Show Overlay</title><link rel="stylesheet" href="/style.css"></head><body><main class="stage" id="stage"></main><script src="/shared.js"></script><script>
const finalQ={question:'What is the only even prime number?',answer:'2'};
let lastVersion=-1,lastScreen='',lastRevealed=false;
const score=s=>`<div class="scoreboard">${s.players.map(p=>`<div class="scoreplayer">${esc(p.name)} <strong>${p.score} PTS</strong></div>`).join('')}</div>`;
function sound(kind){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const notes=kind==='reveal'?[523,659,784,1047]:kind==='final'?[262,330,392,523,659]:[392,523];notes.forEach((n,i)=>{let osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime+i*.11;osc.type='triangle';osc.frequency.setValueAtTime(n,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+.25);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.27)});setTimeout(()=>ctx.close(),1400)}catch(e){}}
async function update(){try{const d=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());render(d)}catch(e){}}
function render({state:s,sets}){if(lastVersion===s.version)return;const changed=lastVersion>=0;if(changed){if((s.screen==='question'&&s.revealed&&!lastRevealed)||(s.screen==='final'&&s.finalRevealed&&!lastRevealed))sound('reveal');else if(s.screen==='final'&&lastScreen!=='final')sound('final');else if(s.screen!==lastScreen)sound('switch')}lastVersion=s.version;lastScreen=s.screen;lastRevealed=s.screen==='final'?s.finalRevealed:s.revealed;
const el=document.getElementById('stage');if(s.screen==='hidden'){el.innerHTML='<div class="hidden"></div>';return}
if(s.screen==='title'){el.innerHTML='<img class="logo" src="/logo.png"><div class="subtitle">THE ULTIMATE TRIVIA CHALLENGE</div>'+score(s);return}
if(s.screen==='board'){el.innerHTML=`<div class="topline"><span class="pill">CHOOSE YOUR CATEGORY</span><span class="pill">${sets.length} ROUNDS • ${sets.reduce((n,x)=>n+x.questions.length,0)} QUESTIONS</span></div><div class="board">`+sets.map((x,i)=>`<div class="tile ${x.questions.every((_,j)=>s.used[i+'-'+j])?'done':''}"><b>${esc(x.name)}</b><small>${x.questions.filter((_,j)=>s.used[i+'-'+j]).length} / ${x.questions.length} ANSWERED</small></div>`).join('')+'</div>'+score(s);return}
if(s.screen==='final'){el.innerHTML=`<div class="finalWrap"><div class="finalHeader">★ FINAL CHALLENGE ★</div><div class="finalQ">${esc(finalQ.question)}</div>${s.finalRevealed?`<div class="finalA">✓ ${esc(finalQ.answer)}</div>`:'<div class="waiting">THE FINAL ANSWER IS LOCKED</div>'}</div>`+score(s);return}
const set=sets[s.set],q=set.questions[s.question];el.innerHTML=`<div class="topline"><span class="pill">${esc(set.name)}</span><span class="pill">ROUND ${s.set+1} / ${sets.length} • QUESTION ${s.question+1} / ${set.questions.length}</span></div><div class="questionwrap"><div class="question">${esc(q.question)}</div>${s.revealed?`<div class="answer">✓ ${esc(q.answer)}</div>`:'<div class="waiting">ANSWER HIDDEN • WAITING FOR REVEAL</div>'}</div>`+score(s)}
update();setInterval(update,650);
</script></body></html>
